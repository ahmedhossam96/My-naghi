[project]
name = "triaxis-demo"
version = "0.1.0"
description = "Triaxis client-demo prototype (local only; inference is simulated)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "triaxis-common",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triaxis_demo"]

[tool.uv.sources]
triaxis-common = { workspace = true }
