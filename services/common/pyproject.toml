[project]
name = "triaxis-common"
version = "0.1.0"
description = "Triaxis shared library: allow-list logging, auth, config, errors, tracing, runtime guards"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "fastapi>=0.115",
    "starlette>=0.41",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triaxis_common"]
