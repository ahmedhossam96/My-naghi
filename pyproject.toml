[project]
name = "triaxis-workspace"
version = "0.1.0"
description = "Triaxis sovereign AI inference platform — workspace root (tooling only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "triaxis-common",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "ruff>=0.8",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
    "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/common"]

[tool.uv.sources]
triaxis-common = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "BLE", "A", "C4", "DTZ", "T10", "T20",
    "ISC", "PIE", "PT", "RET", "SIM", "TID", "ARG", "PTH", "PL", "TRY", "RUF", "ASYNC",
]
ignore = [
    "PLR0913",  # many-argument constructors are normal for config objects
    "TRY003",   # we raise with fixed catalogue messages
    "PLR2004",  # magic values are fine in validators
]

[tool.ruff.lint.isort]
known-first-party = ["triaxis_common", "tools", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Zero retention (ADR 0006) and safetensors-only (ADR 0011).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tempfile".msg = "Zero retention: no temp files. Use in-memory buffers (ADR 0006)."
"pickle".msg = "Never unpickle. Models load from safetensors only (ADR 0011)."
"marshal".msg = "Banned: unsafe deserialisation (ADR 0011)."
"shelve".msg = "Banned: unsafe deserialisation and disk persistence (ADR 0006/0011)."
"dill".msg = "Banned: unsafe deserialisation (ADR 0011)."
"torch.load".msg = "Banned: pickle-based loading. Use safetensors (ADR 0011)."

[tool.ruff.lint.per-file-ignores]
# RUF001: tests deliberately use Arabic and Arabic-Indic characters.
"**/tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "PLR2004", "ARG001", "TID251", "PLC0415", "TRY301", "RUF001"]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "PLR2004", "ARG001", "TID251", "PLC0415", "TRY301", "RUF001"]
"conftest.py" = ["S101"]
# runtime.py is the one place allowed to point tempfile at the tmpfs.
"services/common/src/triaxis_common/runtime.py" = ["TID251"]
"tools/**" = ["T201", "S603"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["services/common/src", "services/common/tests", "tools", "tests", "conftest.py"]
explicit_package_bases = true
mypy_path = "services/common/src:."

[[tool.mypy.overrides]]
module = ["tests.*", "services.common.tests.*", "conftest"]
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["services/common/tests", "tests/unit"]
pythonpath = ["."]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=triaxis_common",
    "--cov=tools",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "requires_linux: test needs Linux /proc",
]

[tool.coverage.run]
branch = true
source = ["triaxis_common", "tools"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", "services/common/tests", ".venv"]
